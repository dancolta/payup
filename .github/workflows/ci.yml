name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev deps
        run: pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check engine bot

      - name: Test (pytest, fully mocked, < 2s)
        run: pytest

      - name: Guardrail suite (explicit gate)
        run: pytest engine/tests/test_guardrails.py engine/tests/test_no_secrets_committed.py engine/tests/test_no_em_dashes.py -v
