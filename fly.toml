# Fly.io config for the PayUp Slack bot.
# Socket Mode = no inbound ports, so there is no [http_service] block: this is a
# pure outbound worker. Rename `app` to something unique before `fly launch`.
#
# Secrets are NOT stored here. Set them with:
#   fly secrets set WAVE_API_TOKEN=... WAVE_BUSINESS_ID=... \
#                   SLACK_BOT_TOKEN=xoxb-... SLACK_APP_TOKEN=xapp-... \
#                   GMAIL_TOKEN_PATH=/app/config/token.json PAYUP_LIVE=1

app = "payup-bot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[processes]
  bot = "python -m bot.app"

# Keep one always-on machine (no scale-to-zero: the daily timer must keep ticking).
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[env]
  PAYUP_DAILY_AT = "09:00"
  SLACK_CHANNEL = "#payup"
