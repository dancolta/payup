# Fly.io config for the PayUp Slack bot.
# Socket Mode = no inbound ports, so there is no [http_service] block: this is a
# pure outbound worker. Rename `app` to something unique before `fly launch`.
#
# Secrets are NOT stored here. Set them with (default source is QuickBooks):
#   fly secrets set QBO_ACCESS_TOKEN=... QBO_REALM_ID=... QBO_REFRESH_TOKEN=... \
#                   QBO_CLIENT_ID=... QBO_CLIENT_SECRET=... \
#                   SLACK_BOT_TOKEN=xoxb-... SLACK_APP_TOKEN=xapp-... PAYUP_LIVE=1 \
#                   GMAIL_TOKEN_JSON="$(cat config/token.json)"
# The Gmail token file is not baked into the image, so pass its contents as the
# GMAIL_TOKEN_JSON secret. (US/CA on Wave instead? Swap the QBO_* set for
# WAVE_API_TOKEN + WAVE_BUSINESS_ID and set PAYUP_SOURCE=wave.)

app = "payup-bot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[processes]
  bot = "python -m bot.app"

# Keep one always-on machine (no scale-to-zero: the daily timer must keep ticking).
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[env]
  PAYUP_DAILY_AT = "09:00"
  SLACK_CHANNEL = "#payup"
