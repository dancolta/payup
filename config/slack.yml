# Slack bot behaviour.

# Channel the bot posts the daily overdue batch into.
channel: "#payup"

# 24h local time for the daily overdue check (HH:MM).
daily_at: "09:00"

# Default action when a batch is posted and you say nothing: send NOTHING.
default_action: "none"

# Approve by replying in the channel: "send all", "send 1 and 3", "skip Delta".
# (Reaction/emoji approval is planned for v1.1 and is not wired yet.)
